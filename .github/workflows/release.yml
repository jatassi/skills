# Tests pull requests into main, and releases every push to main, per
# docs/adr/0002-installs-pinned-to-release-tags.md and
# docs/adr/0003-every-merge-to-main-is-a-release.md.
#
# Changes land on dev and reach main by pull request. On the pull request,
# the vendored tree is checked against its pinned upstreams, and every
# workspace's tests (npm run test:all)
# run on Ubuntu, macOS and Windows at the minimum Node, and the
# bundle it ran against is kept under the git tree it tested. The merge then
# releases without testing again: it requires a tested bundle for exactly the
# tree it is releasing, builds visual-grilling into skills/visual-grilling/dist/,
# checks the build against that bundle, bumps both plugin manifests (patch, or
# the pull request's release:minor or release:major label), pins the
# marketplace entry to the new tag, commits, tags that commit vX.Y.Z, pushes
# both, creates a GitHub Release, and fast-forwards dev to the release commit.
#
# Dispatching it by hand on main tests and releases main as it is: the way to
# retry a release that failed after its merge.
#
# This is the only thing that commits dist/, and the only workflow in the repo.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Release notes (Markdown); GitHub's generated notes and each output's size follow them
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Pull requests test in their own group; releases queue one at a time.
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.22.2

jobs:
  preflight:
    name: Require main
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch the release from main, not $GITHUB_REF"
          exit 1

  test:
    name: npm test (${{ matrix.os }})
    needs: preflight
    # A push to main was tested on its pull request.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.preflight.result != 'failure' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Golden files and fixtures are compared byte for byte.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      # On a pull request, the merge of it into main: the tree main will have.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      # Every vendored file must be its pinned upstream file after the
      # substitution table, or a fork declared in vendor/forks.json, and none
      # may carry a Cursor-ism, a pinned model version, a CLAUDE.md reference,
      # an un-namespaced agent type or a playbook step naming a missing skill.
      # See docs/adr/0004-vendoring-pinned-upstreams-with-declared-forks.md.
      # The vendor workspace runs it too, at the end of its tests; this step
      # names the failure.
      - name: Check the vendored tree
        if: runner.os == 'Linux'
        run: npm run vendor -- check
      # Browser tests (round page and block corpus) run on Ubuntu only. The
      # POSIX-only checks skip themselves on Windows.
      - run: npm run test:all
        env:
          VG_SKIP_BROWSER_TESTS: ${{ runner.os == 'Linux' && '0' || '1' }}
      - name: Name the tested bundle after the tested tree
        if: runner.os == 'Linux'
        run: echo "BUNDLE=tested-bundle-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      # The bundle every test above ran against, for the release to check its
      # own build against. Kept long enough for a pull request to wait a while
      # between its last push and its merge.
      - name: Keep the tested bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: packages/visual-grilling/.test-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build, tag and publish
    needs: test
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.test.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The pushed or dispatched commit. If main has moved on since, the push
      # below is not a fast-forward and fails.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Find the tested bundle for this tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          name="tested-bundle-$tree"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            run=$GITHUB_RUN_ID
          else
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
            if [ -z "$run" ]; then
              echo "::error::No pull request tested tree $tree. Merge through a pull request from dev whose checks passed with main up to date, or dispatch Release to test and release main as it is."
              exit 1
            fi
            conclusion=$(gh run view "$run" --json conclusion --jq .conclusion)
            if [ "$conclusion" != success ]; then
              echo "::error::The run that tested tree $tree (run $run) did not pass: $conclusion"
              exit 1
            fi
          fi
          gh run download "$run" --name "$name" --dir "$RUNNER_TEMP/tested-bundle"
      - name: Work out the version and notes
        env:
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first // {}')
            labels=$(jq -r '[.labels[]?.name] | join(",")' <<<"$pr")
            case ",$labels," in
              *,release:major,*) BUMP='major' ;;
              *,release:minor,*) BUMP='minor' ;;
              *) BUMP='patch' ;;
            esac
            NOTES=$(jq -r '.body // ""' <<<"$pr")
          fi
          VERSION=$(node packages/visual-grilling/release.ts next --bump "$BUMP")
          echo "Releasing v$VERSION ($BUMP)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
      - name: Require a new tag
        run: |
          # --exit-code: 0 when the tag exists, 2 when it doesn't, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::Could not list the remote's tags (git exited $status)"
            exit 1
          fi
      - run: npm ci
      - name: Build into skills/visual-grilling/dist/
        run: npm run try
      # Ships exactly what was tested: the build is deterministic, so any
      # difference means something changed between the two builds.
      - name: Require the build to match the tested bundle
        run: diff -r "$RUNNER_TEMP/tested-bundle" skills/visual-grilling/dist
      - name: Bump the manifests and pin the marketplace to the tag
        run: node packages/visual-grilling/release.ts manifests --version "$VERSION"
      - name: Write the release notes
        run: |
          node packages/visual-grilling/release.ts notes --dist skills/visual-grilling/dist --notes "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/release.md"
          cat "$RUNNER_TEMP/release.md"
      - name: Commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json
          # dist/ is gitignored so that nothing else commits it.
          git add --all --force skills/visual-grilling/dist
          if [ -n "$(git status --porcelain --untracked-files=all | grep -v '^[AMDR] ')" ]; then
            echo "::error::The release changed files it should not have:"
            git status --short --untracked-files=all
            exit 1
          fi
          git commit --quiet -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
      # A push with the workflow's token does not start another run.
      - name: Push main and the tag
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
      - name: Create the GitHub Release
        # The notes and sizes come first, then GitHub's list of changes.
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release.md" --generate-notes --verify-tag
      # So the next pull request from dev starts from the release. Through the
      # API, which checks the fast-forward itself: the shallow checkout has no
      # history for git to check it with. Not a failure if dev has moved on:
      # the release commit reaches it through that pull request's merge.
      - name: Fast-forward dev to the release
        run: |
          if ! gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/dev" \
              -f sha="$(git rev-parse HEAD)" -F force=false; then
            echo "::notice::dev has moved on from main, so it was not fast-forwarded to v$VERSION"
          fi
