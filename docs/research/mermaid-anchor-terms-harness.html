<title>Mermaid anchor harness</title>
<!--
  Test page for docs/research/mermaid-anchor-terms.md (ticket #10).
  No build step: serve this folder (e.g. `python3 -m http.server`) and open the page,
  or load it headless and call window.harness.dumpAll().
  Renders one sample per diagram type Mermaid 12.0.0 ships, with look `neo` and the
  default layout (ELK), then lets you click any element to see what the SVG exposes
  for it and what the nearest identity-carrying ancestor is.
-->
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#666; --line:#ddd; --hi:#fff3bf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#eee; --muted:#aaa; --line:#333; --hi:#4a3f00; } }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 380px; gap:0; }
  #diagrams { padding:16px; }
  section.d { border:1px solid var(--line); border-radius:8px; margin:0 0 16px; padding:8px 12px; }
  section.d h2 { font-size:14px; margin:0 0 6px; }
  section.d .err { color:#c33; white-space:pre-wrap; }
  section.d svg { max-width:100%; height:auto; }
  aside { position:sticky; top:0; height:100vh; overflow:auto; border-left:1px solid var(--line); padding:12px; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { position:static; height:auto; border-left:0; border-top:1px solid var(--line); } }
  .picked { outline:2px solid orange; }
</style>
</head>
<body>
<header><strong>Mermaid 12 anchor harness</strong> · click any element in a diagram to see its attribute chain</header>
<main><div id="diagrams"></div><aside id="out">Rendering…</aside></main>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';

// look: neo for every type; layout left at the 12.0 global default (elk).
mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', look: 'neo' });

// Edge cases behind specific findings in mermaid-anchor-terms.md.
Object.assign(SAMPLES, {
'x-flowchart-edge-ids': `flowchart LR
  my_node["U"] --> other-node["H"]
  A --> B
  A --> B
  A -->|again| B
  A e1@--> C`,
'x-flowchart-id-collision': `flowchart TD
  a_b --> c
  a --> b_c`,
'x-sequence-multiline': `sequenceDiagram
  participant A as Alice
  participant B
  A->>B: one
  B-->>A: two<br/>lines
  loop every hour
    A->>A: self
  end
  Note right of B: a note
  A-)B: async`,
'x-class-terminals': `classDiagram
  A "1" --> "many" B
  B "x" --> "y" C : lbl
  C --> A
  note for B "For B"`,
'x-state-numbering': `stateDiagram-v2
  state Review {
    [*] --> Checking
    Checking --> Done : ok
  }
  [*] --> Draft
  Draft --> Review : submit
  Draft --> Review : again
  state pick <<choice>>
  Review --> pick
  pick --> Draft : no`,
'x-er-attributes': `erDiagram
  CUSTOMER["Customer table"] {
    string name PK "the name"
    string email UK
  }
  ORDER { int id PK }
  CUSTOMER ||--o{ ORDER : places
  CUSTOMER ||--o{ ORDER : returns`,
'x-gantt-auto-ids': `gantt
  dateFormat YYYY-MM-DD
  section Alpha
    First task :2026-09-01, 2d
    Second :after task1, 1d
  section Beta
    Named :nm, 2026-09-02, 2d
    Crit :crit, 2026-09-03, 1d`,
'x-pie-small-slice': `pie
  "Small" : 10
  "Big" : 60
  "Tiny" : 0.2
  "Big" : 5`,
'x-timeline-before-section': `timeline
  2001 : E1 : E2
  section S1
    2002 : E3`,
'x-packet-wrap': `packet
0-15: "A"
16-47: "Spans rows"`,
'x-gitgraph-auto-ids': `gitGraph
  commit
  commit id: "named"
  branch feat
  commit
  checkout main
  merge feat`,
'x-treeview-duplicates': `treeView-beta
  root/
    a/
      index.js
    b/
      index.js`,
'x-treemap-duplicates': `treemap-beta
"Root"
  "A"
    "x": 5
    "y": 50
  "B"
    "x": 20`,
});

const host = document.getElementById('diagrams');
const out = document.getElementById('out');
const results = {};

// ---- attribute helpers -------------------------------------------------------
// Styling-only attributes Mermaid stamps everywhere; they say nothing about which element it is.
const NOT_IDENTITY = new Set(['data-look', 'data-color-id', 'data-points', 'data-edge', 'aria-hidden']);
const IDENTITY = e => e.nodeType === 1 && (!!e.id || [...e.attributes].some(a => (a.name.startsWith('data-') || a.name.startsWith('aria-')) && !NOT_IDENTITY.has(a.name)));
function attrs(e) {
  const o = {};
  for (const a of e.attributes) if (a.name === 'id' || a.name === 'class' || a.name.startsWith('data-') || a.name.startsWith('aria-') || a.name === 'role') o[a.name] = a.value;
  const t = [...e.children].find(c => c.tagName === 'title');
  if (t) o['<title>'] = t.textContent.trim();
  return o;
}
const ownText = e => (e.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
function chain(e, svg) {
  const c = [];
  for (let n = e; n && n !== svg.parentNode; n = n.parentNode) c.push({ tag: n.tagName.toLowerCase(), ...attrs(n) });
  return c;
}
function nearestIdentity(e, svg) {
  for (let n = e; n && n !== svg; n = n.parentNode) if (IDENTITY(n) && n.tagName.toLowerCase() !== 'svg') return n;
  return null;
}
const sig = e => {
  const cls = (e.getAttribute('class') || '').replace(/\d+/g, '#');
  const names = [...e.attributes].map(a => a.name).filter(n => n === 'id' || n.startsWith('data-') || n.startsWith('aria-') || n === 'role').sort();
  return `${e.tagName.toLowerCase()}.${cls}[${names.join(',')}]`;
};

// ---- per-diagram dump ---------------------------------------------------------
function dump(name) {
  const sec = document.getElementById('sec-' + name);
  const svg = sec.querySelector('svg');
  if (!svg) return { error: results[name]?.error || 'no svg' };
  sec.scrollIntoView({ block: 'start' });
  // 1. Every element carrying identity, grouped by signature.
  const groups = {};
  for (const e of svg.querySelectorAll('*')) {
    if (!IDENTITY(e) && !e.getAttribute('class')) continue;
    const s = sig(e);
    (groups[s] ||= { count: 0, samples: [] }).count++;
    if (groups[s].samples.length < 4) groups[s].samples.push({ ...attrs(e), text: ownText(e) });
  }
  // 2. Every visible text leaf: what a click on it hits, and where the walk up lands.
  const leaves = [...svg.querySelectorAll('text, tspan, span, p, div')].filter(e => ![...e.children].some(c => ['tspan', 'span', 'p', 'div'].includes(c.tagName.toLowerCase())) && ownText(e));
  const texts = leaves.map(e => {
    const r = e.getBoundingClientRect();
    const hit = r.width && r.height ? document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2) : null;
    const target = hit && svg.contains(hit) ? hit : e;
    const idn = nearestIdentity(target, svg);
    return { text: ownText(e), hitTag: hit ? hit.tagName.toLowerCase() : null, hitInSvg: !!(hit && svg.contains(hit)), identity: idn ? { tag: idn.tagName.toLowerCase(), ...attrs(idn) } : null };
  });
  // 3. Identity-carrying graphics: does a click at their centre reach them (or a descendant)?
  const shapes = [...svg.querySelectorAll('*')].filter(e => IDENTITY(e) && !e.closest('defs, marker, symbol, filter') && e.tagName.toLowerCase() !== 'svg').slice(0, 60).map(e => {
    const r = e.getBoundingClientRect();
    const hit = r.width || r.height ? document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2) : null;
    const lands = hit ? nearestIdentity(hit, svg) : null;
    return { el: { tag: e.tagName.toLowerCase(), ...attrs(e) }, hitTag: hit && hit.tagName.toLowerCase(), reachesSelf: !!(hit && (hit === e || e.contains(hit))), landsOn: lands && (lands === e ? 'self' : { tag: lands.tagName.toLowerCase(), ...attrs(lands) }) };
  });
  return { svgId: svg.id, groups, texts, shapes };
}

async function renderAll() {
  for (const [name, src] of Object.entries(SAMPLES)) {
    const sec = document.createElement('section');
    sec.className = 'd'; sec.id = 'sec-' + name;
    sec.innerHTML = `<h2>${name}</h2>`;
    host.append(sec);
    const t0 = performance.now();
    try {
      const { svg, diagramType } = await mermaid.render('d-' + name, src);
      sec.insertAdjacentHTML('beforeend', svg);
      results[name] = { diagramType, ms: Math.round(performance.now() - t0) };
    } catch (err) {
      sec.insertAdjacentHTML('beforeend', `<pre class="err"></pre>`);
      sec.querySelector('.err').textContent = String(err && err.message || err);
      results[name] = { error: String(err && err.message || err) };
    }
  }
  out.textContent = 'Rendered. Click any element.';
}

host.addEventListener('click', ev => {
  const svg = ev.target.closest('svg');
  if (!svg) return;
  document.querySelectorAll('.picked').forEach(e => e.classList.remove('picked'));
  const idn = nearestIdentity(ev.target, svg);
  if (idn) idn.classList.add('picked');
  out.textContent = JSON.stringify({ diagram: svg.id, target: ev.target.tagName, nearestIdentity: idn && attrs(idn), chain: chain(ev.target, svg) }, null, 2);
});

window.harness = {
  SAMPLES, results, dump,
  ready: renderAll(),
  async dumpAll() { await this.ready; const o = {}; for (const n of Object.keys(SAMPLES)) o[n] = { ...results[n], ...dump(n) }; return o; },
  mermaidVersion: () => mermaid.version ?? null,
};
</script>
